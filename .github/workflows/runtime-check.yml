name: Runtime check
on:
  push:
  pull_request:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check runtime contract
        run: npx @shiplet/runtime-kit shiplet-check --json
