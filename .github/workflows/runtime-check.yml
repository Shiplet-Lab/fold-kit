name: Runtime check
on:
  push:
  pull_request:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run checker tests
        run: npm test
      - name: Check example application
        working-directory: examples/sample-node
        run: node ../../bin/shiplet-check.mjs --json
